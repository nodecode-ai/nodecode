name: CI

# Every push to main, and every pull request from a branch of this repository,
# is built on self-hosted runners, the same way a release is built:
#   linux    lint, the release tarball (pack.sh), the core test suite
#   macos    the Mac half of the release, driven over ssh (pack-macos.sh)
#   windows  the release's Windows half: build-windows.ps1 and both smokes
#   proofs   every Lean proof under proofs/, strict and on the classical
#            axioms only (`just proofs')
#   scaling  every hot path's cost at three sizes, its growth held to its
#            contract (`just perf'; src/perf/scaling.lisp), after linux
# The scripts live in src/tools/ci-*, so a job is one step and the same check
# runs by hand on the same machine.
#
# The repository is public, so a pull request from a fork never runs on our
# machines: its code would run there. Linux, macOS and Windows show as
# skipped; a maintainer pushes the branch into this repository to build it.
# Proofs runs on every run all the same: Lean needs no machine of ours and no
# secret, so a fork's proofs are checked on a GitHub-hosted runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nc-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint, build the release tarball, run the core suite
        run: src/tools/ci/ci-linux.sh

  scaling:
    name: Scaling
    # After Linux, on the box Linux ran on: its release build leaves the SBCL
    # and quicklisp this needs, and the slopes are fitted on a box that is not
    # also running the suite.
    needs: linux
    runs-on: [self-hosted, nc-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hold every hot path's growth to its contract
        run: src/tools/ci-scaling.sh

  proofs:
    name: Proofs
    # Ours on nc-linux, whose ~/.elan keeps the toolchain between runs; a
    # fork's on a fresh GitHub-hosted runner, where ci-proofs.sh installs elan.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "nc-linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every Lean proof under proofs/
        run: src/tools/ci/ci-proofs.sh

  macos:
    name: macOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nc-mac-driver]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build, pack and smoke the Mac release
        run: src/tools/ci/ci-macos.sh

  windows:
    name: Windows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nc-windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build nodecode.exe and run both smokes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src\tools\ci\ci-windows.ps1
